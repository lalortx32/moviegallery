<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Movie Gallery 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff5c98;
    --pink-dark: #d93f7a;
    --pink-mid: #ff9dc2;
    --pink-soft: #ffd6e7;
    --pink-bg: #fff4f8;
    --text: #4a1f35;
    --muted: #a0667f;
    --white: #ffffff;
    --me: #ff5c98;
    --her: #b48cff;
    --leather: #6a3c22;
    --leather-light: #8a5632;
    --leather-dark: #3d2214;
    --stitch: #f0d4a8;
    --paper: #ffffff;
    --paper-line: #e6e6ea;
    --ink: #4a2615;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Nunito", "Trebuchet MS", system-ui, sans-serif;
    font-weight: 800;
    color: var(--text);
    min-height: 100vh;
    background: linear-gradient(120deg, #ffffff 0%, #fff0f6 25%, #ffffff 50%, #ffe2ef 75%, #ffffff 100%);
    background-size: 300% 300%;
    animation: gradShift 16s ease infinite;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  @keyframes gradShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .bg-hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bg-hearts svg { position: absolute; opacity: .2; }
  .fall { animation: fallDown linear infinite; }
  .rise { animation: riseUp linear infinite; }
  @keyframes fallDown {
    from { transform: translate3d(0, 0, 0) rotate(0deg); }
    to   { transform: translate3d(20px, 125vh, 0) rotate(25deg); }
  }
  @keyframes riseUp {
    from { transform: translate3d(0, 0, 0) rotate(0deg); }
    to   { transform: translate3d(-20px, -125vh, 0) rotate(-25deg); }
  }

  /* Верхняя полоса */
  .topbar {
    position: fixed; top: 14px; right: 16px; z-index: 8;
    display: flex; align-items: center; gap: 12px;
  }
  .lang {
    display: flex;
    border: 3px solid var(--pink-soft);
    border-radius: 999px;
    overflow: hidden;
    background: var(--white);
  }
  .lang button {
    font: inherit;
    font-size: 16px;
    font-weight: 900;
    padding: 8px 16px;
    border: none;
    background: none;
    color: var(--muted);
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), background .2s;
  }
  .lang button.on { background: var(--pink); color: var(--white); }

  .mini { position: relative; animation: sway 4s ease-in-out infinite; transform-origin: 50% 0; }
  @keyframes sway {
    0%, 100% { transform: translateY(0) rotate(-2.5deg); }
    50%      { transform: translateY(-4px) rotate(2.5deg); }
  }
  .mini-btn {
    width: 62px; height: 62px;
    border: 3px solid var(--pink-soft);
    border-radius: 18px;
    background: var(--white);
    display: grid; place-items: center;
    box-shadow: 4px 4px 0 var(--pink-soft);
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), background .2s;
  }
  .mini-btn:hover { background: var(--pink-bg); }
  .mini-pop {
    position: absolute; right: 0; top: 74px;
    width: 290px;
    background: var(--white);
    border: 3px solid var(--pink-soft);
    border-radius: 18px;
    padding: 10px;
    box-shadow: 5px 5px 0 var(--pink-soft);
    display: none;
    gap: 8px;
    animation: pop .25s cubic-bezier(.34,1.56,.64,1);
  }
  .mini-pop.open { display: grid; }
  .mini-pop button {
    font: inherit;
    font-size: 18px;
    font-weight: 900;
    text-align: left;
    padding: 14px 16px;
    border: none;
    border-radius: 14px;
    background: none;
    color: var(--text);
    display: flex; justify-content: space-between; align-items: center;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), background .2s;
  }
  .mini-pop button:hover { background: var(--pink-bg); }
  .mini-pop button.on { background: var(--pink); color: var(--white); }
  .mini-pop button small { font-weight: 900; opacity: .85; font-size: 16px; }

  .wrap {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 90px 16px 70px;
  }
  .stage { width: 100%; max-width: 780px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 22px; }
  h1 {
    font-family: "Press Start 2P", monospace;
    font-size: clamp(13px, 3.2vw, 20px);
    color: var(--pink);
    margin: 0 0 12px;
    line-height: 1.6;
    text-shadow: 3px 3px 0 var(--pink-soft);
  }
  .sub { color: var(--muted); font-size: 16px; margin: 0; font-weight: 800; }
  .hearts-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }

  .panel {
    background: var(--white);
    border: 3px solid var(--pink-soft);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 6px 6px 0 var(--pink-soft);
  }
  .grid-form { display: grid; grid-template-columns: 1fr 110px; gap: 12px; }
  .full { grid-column: 1 / -1; }
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 5px; font-weight: 900; }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 3px solid var(--pink-soft);
    border-radius: 14px;
    font: inherit;
    font-weight: 800;
    font-size: 16px;
    color: var(--text);
    background: var(--pink-bg);
    outline: none;
    transition: border-color .2s, background .2s, transform .2s;
  }
  input:focus { border-color: var(--pink-mid); background: var(--white); transform: scale(1.01); }
  .who { display: flex; gap: 8px; }
  .who button {
    flex: 1;
    padding: 11px 0;
    border: 3px solid var(--pink-soft);
    border-radius: 14px;
    background: var(--white);
    color: var(--muted);
    font: inherit;
    font-weight: 900;
    font-size: 15px;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), background .2s;
  }
  .who button.on { background: var(--pink-soft); color: var(--text); border-color: var(--pink-mid); }
  .btn-primary {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 16px;
    background: var(--pink);
    color: var(--white);
    font: inherit;
    font-weight: 900;
    font-size: 17px;
    box-shadow: 0 5px 0 var(--pink-dark);
    transition: transform .12s, box-shadow .12s, background .2s;
  }
  .btn-primary:hover { background: #ff4a8c; }
  .err { color: var(--pink-dark); font-size: 14px; min-height: 18px; margin-top: 8px; font-weight: 900; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 5px; font-weight: 800; }

  .list { display: grid; gap: 14px; margin-top: 18px; }
  .card {
    background: var(--white);
    border: 3px solid var(--pink-soft);
    border-radius: 18px;
    padding: 16px 18px;
    display: grid;
    gap: 9px;
    animation: pop .35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop {
    from { transform: scale(.92) translateY(8px); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  .ct { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .ct h3 { margin: 0; font-size: 20px; font-weight: 900; color: var(--text); word-break: break-word; }
  .yr { color: var(--muted); font-size: 15px; font-weight: 900; white-space: nowrap; }
  .meta { font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 800; }
  .tag { padding: 3px 11px; border-radius: 999px; color: var(--white); font-size: 13px; font-weight: 900; }
  .tag.me { background: var(--me); }
  .tag.her { background: var(--her); }
  .rate { display: flex; gap: 4px; }
  .hbtn { background: none; border: none; padding: 2px; line-height: 0; transition: transform .18s cubic-bezier(.34,1.56,.64,1); }
  .hbtn:hover { transform: scale(1.2); }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .acts button, .link {
    font: inherit;
    font-size: 14px;
    font-weight: 900;
    padding: 9px 13px;
    border-radius: 12px;
    border: 3px solid var(--pink-soft);
    background: var(--white);
    color: var(--text);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), background .2s, border-color .2s;
  }
  .link { background: var(--pink-bg); }
  .acts button:hover, .link:hover { border-color: var(--pink-mid); background: var(--pink-soft); }
  .acts .done { background: var(--pink); border-color: var(--pink); color: var(--white); }
  .acts .done:hover { background: #ff4a8c; border-color: #ff4a8c; }
  .acts .del { color: var(--muted); margin-left: auto; }
  .acts .del:hover { color: var(--pink-dark); border-color: var(--pink-dark); background: var(--white); }

  .act-item {
    display: flex; gap: 12px; align-items: center;
    background: var(--white); border: 3px solid var(--pink-soft);
    border-radius: 16px; padding: 12px 14px;
    animation: pop .35s cubic-bezier(.34,1.56,.64,1);
    transition: transform .18s cubic-bezier(.34,1.56,.64,1);
  }
  .act-item:hover { transform: translateX(4px); }
  .act-item .ai { flex: none; line-height: 0; }
  .act-item b { display: block; font-size: 16px; font-weight: 900; color: var(--text); }
  .act-item small { color: var(--muted); font-size: 13px; font-weight: 800; }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 10px;
    font-size: 16px;
    border: 3px dashed var(--pink-soft);
    border-radius: 18px;
    background: rgba(255,255,255,.75);
    font-weight: 900;
  }

  /* ===== Блокнот: коричневая кожа ===== */
  .book-scene {
    perspective: 1800px;
    width: min(94vw, 780px);
    margin: 0 auto;
  }
  .book {
    position: relative;
    width: 100%;
    aspect-ratio: 18 / 16;
    transform-style: preserve-3d;
  }
  .cover {
    position: absolute; inset: 0; z-index: 4;
    border-radius: 8px 20px 20px 8px;
    background:
      radial-gradient(circle at 25% 30%, rgba(255,214,160,.22) 0 10%, transparent 28%),
      radial-gradient(circle at 70% 60%, rgba(255,200,140,.18) 0 12%, transparent 30%),
      radial-gradient(circle at 40% 80%, rgba(30,14,6,.35) 0 14%, transparent 34%),
      repeating-radial-gradient(circle at 50% 50%, rgba(0,0,0,.06) 0 1px, transparent 1px 3px),
      linear-gradient(135deg, #8c5830 0%, #6b3d21 50%, #7d4a27 100%);
    box-shadow: 12px 14px 0 var(--leather-dark), inset 18px 0 0 rgba(0,0,0,.3), inset 0 0 40px rgba(0,0,0,.25);
    transform-origin: left center;
    transition: transform 1s cubic-bezier(.6,.05,.3,1);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .cover.open { transform: rotateY(-172deg); pointer-events: none; }
  .cover-inner {
    display: grid; justify-items: center; gap: 22px; text-align: center;
    padding: 30px;
    color: #f5dcc0;
    outline: 3px dashed var(--stitch);
    outline-offset: -18px;
    border-radius: 6px;
    width: 100%; height: 100%;
    align-content: center;
    animation: bob 3.2s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }
  .cover-title {
    font-family: "Press Start 2P", monospace;
    font-size: clamp(11px, 2.6vw, 17px);
    line-height: 1.7;
    text-shadow: 3px 3px 0 var(--leather-dark);
    margin: 0;
    color: #f5dcc0;
  }
  .cover-hint { font-size: 15px; font-weight: 900; opacity: .9; margin: 0; }
  .cover:hover .cover-inner { transform: scale(1.04); transition: transform .2s; }

  .strap {
    position: absolute; top: 0; bottom: 0; left: 74%; width: 12%;
    background: linear-gradient(90deg, #3d2214, #6a3c22 50%, #3d2214);
    box-shadow: 2px 0 6px rgba(0,0,0,.3), -2px 0 6px rgba(0,0,0,.3);
    pointer-events: none; z-index: 2;
  }
  .strap::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 10%; right: 10%;
    border-left: 2px dashed var(--stitch); border-right: 2px dashed var(--stitch);
    opacity: .85;
  }
  .strap-tail {
    position: absolute; left: 0; right: 0; bottom: -80px; height: 90px;
    background: linear-gradient(90deg, #3d2214, #6a3c22 50%, #3d2214);
    clip-path: polygon(0 0, 100% 0, 100% 55%, 50% 100%, 0 55%);
  }
  .spread {
    position: absolute; inset: 0; z-index: 1;
    display: flex;
    border-radius: 8px 20px 20px 8px;
    background: var(--paper);
    box-shadow: 0 16px 34px rgba(61,34,20,.35);
    overflow: hidden;
  }
  .spread::after {
    content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 34px;
    transform: translateX(-50%); pointer-events: none;
    background: linear-gradient(90deg, rgba(61,34,20,0), rgba(61,34,20,.28) 50%, rgba(61,34,20,0));
  }
  .page {
    flex: 1; position: relative; padding: 16px 18px 30px;
    background-image: repeating-linear-gradient(to bottom, transparent 0 34px, var(--paper-line) 34px 35px);
    background-color: var(--paper);
    min-width: 0;
    backface-visibility: hidden;
  }
  .page.left { border-radius: 8px 0 0 8px; }
  .page.right { border-radius: 0 20px 20px 0; }
  .pcontent { display: flex; flex-direction: column; height: 100%; gap: 8px; }
  .film-head { border-bottom: 2px dashed #c9a57a; padding-bottom: 6px; min-width: 0; }
  .film-head h4 {
    margin: 0; font-size: 17px; font-weight: 900; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .film-head small { display: block; color: #8a6446; font-weight: 800; font-size: 12px; margin-top: 2px; }
  .film-head .st { color: var(--pink-dark); font-weight: 900; }
  .slots { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; flex: 1; min-height: 0; }
  .slot {
    position: relative; border-radius: 12px; overflow: hidden;
    border: 3px dashed var(--pink-mid);
    background: rgba(255,255,255,.7);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; min-height: 0;
    transition: transform .2s cubic-bezier(.34,1.56,.64,1), border-color .2s;
  }
  .slot:hover { transform: scale(1.04) rotate(-1.5deg); border-color: var(--pink); }
  .slot:active { transform: scale(.92); }
  .slot.add { font-family: "Press Start 2P", monospace; font-size: 20px; color: var(--pink); }
  .slot.add small { font-family: "Nunito", sans-serif; font-size: 12px; font-weight: 900; color: var(--muted); margin-top: 6px; display: block; }
  .slot.ghost { cursor: default; border-color: #d9c3a0; background: transparent; }
  .slot.ghost:hover { transform: none; }
  .slot.filled { border: 3px solid #fff; box-shadow: 0 2px 6px rgba(61,34,20,.25); cursor: zoom-in; background: #fff; }
  .slot.filled:hover { transform: scale(1.03) rotate(1deg); }
  .slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slot .x {
    position: absolute; top: 4px; right: 4px;
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--pink-soft); background: var(--white);
    color: var(--muted); font-size: 12px; font-weight: 900; padding: 0;
    display: grid; place-items: center;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), color .2s;
  }
  .slot .x:hover { color: var(--pink-dark); transform: scale(1.15); }
  .slot .cap {
    position: absolute; left: 0; right: 0; bottom: 0;
    border: none; border-radius: 0; padding: 4px 6px;
    font-size: 12px; background: rgba(255,255,255,.88);
  }
  .empty-page { color: #8a6446; font-weight: 900; text-align: center; margin: auto; padding: 20px; font-size: 15px; }
  .page-no {
    position: absolute; bottom: 6px; font-size: 12px; color: #8a6446; font-weight: 900;
  }
  .page.left .page-no { left: 14px; }
  .page.right .page-no { right: 14px; }

  .leaf {
    position: absolute; top: 0; bottom: 0; width: 50%; z-index: 3;
    transform-style: preserve-3d;
    transition: transform .9s cubic-bezier(.6,.05,.3,1);
    pointer-events: none;
    visibility: hidden;
  }
  .leaf.next { left: 50%; transform-origin: left center; }
  .leaf.prev { left: 0; transform-origin: right center; }
  .leaf.show { visibility: visible; }
  .leaf.next.turn { transform: rotateY(-180deg); }
  .leaf.prev.turn { transform: rotateY(180deg); }
  .leaf .face {
    position: absolute; inset: 0; padding: 16px 18px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background-color: var(--paper);
    background-image: repeating-linear-gradient(to bottom, transparent 0 34px, var(--paper-line) 34px 35px);
    overflow: hidden;
  }
  .leaf .face.back { transform: rotateY(180deg); }
  .leaf.next .face.front { border-radius: 0 20px 20px 0; }
  .leaf.prev .face.front { border-radius: 8px 0 0 8px; }
  .leaf.next .face.back { border-radius: 8px 0 0 8px; }
  .leaf.prev .face.back { border-radius: 0 20px 20px 0; }

  .book-nav {
    display: flex; justify-content: center; align-items: center; gap: 12px;
    margin-top: 22px; flex-wrap: wrap;
  }
  .book-nav button {
    font: inherit; font-size: 16px; font-weight: 900;
    padding: 10px 16px; border-radius: 14px;
    border: 3px solid var(--pink-soft); background: var(--white); color: var(--text);
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), background .2s, border-color .2s;
  }
  .book-nav button:hover:not(:disabled) { background: var(--pink-soft); border-color: var(--pink-mid); }
  .book-nav button:disabled { opacity: .4; }
  .book-nav .pgno { font-weight: 900; color: var(--muted); min-width: 110px; text-align: center; }
  .book-hint { text-align: center; color: var(--muted); font-size: 14px; margin: 16px 0 0; font-weight: 800; }

  #lb {
    position: fixed; inset: 0; background: rgba(61, 34, 20, .85);
    display: none; align-items: center; justify-content: center; z-index: 10; padding: 20px;
  }
  #lb.open { display: flex; }
  #lb img { max-width: 100%; max-height: 90vh; border-radius: 16px; border: 4px solid var(--white); }

  /* Кнопка «для кого» слева снизу */
  .for-wrap { position: fixed; left: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 6; }
  .for-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 2px solid var(--pink-soft);
    background: var(--white);
    display: grid; place-items: center;
    padding: 0;
    box-shadow: 2px 2px 0 var(--pink-soft);
    transition: transform .18s cubic-bezier(.34,1.56,.64,1);
  }
  .for-btn:hover { transform: scale(1.15); }
  .for-pop {
    position: absolute; left: 0; bottom: 44px;
    background: var(--white);
    border: 3px solid var(--pink-soft);
    border-radius: 14px;
    padding: 6px;
    box-shadow: 4px 4px 0 var(--pink-soft);
    display: none;
    gap: 6px;
    min-width: 170px;
    animation: pop .25s cubic-bezier(.34,1.56,.64,1);
  }
  .for-pop.open { display: grid; }
  .for-pop button {
    font: inherit; font-size: 14px; font-weight: 900;
    padding: 9px 12px; border: none; border-radius: 10px;
    background: none; color: var(--text); text-align: left;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), background .2s;
  }
  .for-pop button:hover { background: var(--pink-bg); }
  .for-pop button.on { background: var(--pink); color: var(--white); }

  /* Анимации нажатий */
  button, a, label, .link { -webkit-tap-highlight-color: transparent; }
  button:active, .link:active, .hbtn:active, .who button:active, .lang button:active,
  .mini-btn:active, .mini-pop button:active, .for-btn:active, .for-pop button:active,
  .book-nav button:active {
    transform: scale(.88) !important;
    transition-duration: .08s !important;
  }
  .btn-primary:active { transform: translateY(4px) scale(.98) !important; box-shadow: 0 1px 0 var(--pink-dark) !important; }

  .burst {
    position: fixed; pointer-events: none; z-index: 20;
    animation: burst .75s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes burst {
    from { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    to   { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.2) rotate(40deg); opacity: 0; }
  }

  .section-activity { }
  .activity-list { display: grid; gap: 14px; }

  @media (max-width: 600px) {
    .mini-pop { width: 250px; }
    .mini-btn { width: 56px; height: 56px; }
    .page { padding: 12px 10px 24px; }
    .slots { gap: 6px; }
    .slot.add { font-size: 16px; }
    .film-head h4 { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    body, .fall, .rise, .mini, .cover-inner { animation: none !important; }
  }
</style>
</head>
<body>
<div class="bg-hearts" id="bgHearts"></div>

<div class="topbar">
  <div class="lang">
    <button type="button" data-lang="ru" class="on">RU</button>
    <button type="button" data-lang="en">EN</button>
  </div>

<script>
const KEY = 'kinoclub-v1';
const MAX_PER_PAGE = 4;
const HEART = [
  ".##.##.",
  "#######",
  "#######",
  ".#####.",
  "..###..",
  "...#..."
];
const ARROW = [
  "X...........",
  "XX..........",
  "XFX.........",
  "XFFX........",
  "XFFFX.......",
  "XFFFFX......",
  "XFFFFFX.....",
  "XFFFFFFX....",
  "XFFFXXXX....",
  "XFFXFX......",
  "XFX.XFX.....",
  "XX..XFX.....",
  "X....XFX....",
  ".....XX....."

const T = {
  ru: {

    tabGallery: "Галерея",
    tabActivity: "Наша активность",
    coverHint: "нажми, чтобы открыть блокнот",
    closeBook: "закрыть блокнот",
    slotAdd: "+ фото",
    statWant: "хотим посмотреть",
    statSeen: "посмотрели",
    bookEmpty: "сначала добавь фильм во вкладке «Хотим посмотреть» — для него появится страница 💗",
    loosePage: "без фильма",

    galCaption: "подпись...",

    actRated: "оценка {n} сердечек для «{t}»",
    actDeleted: "удалён фильм «{t}»",
    actPhoto: "добавлено фото на страницу «{t}»",
    actPhotoDel: "удалено фото из блокнота",
    locale: "ru-RU"
  },
  en: {
    sub: "everything we've watched and want to watch together",
    fTitle: "Title",
    fYear: "Year",
    fWho: "Added by",
    me: "Me",
    her: "Her",
    fLink: "IMDb or Letterboxd link",
    fLinkHint: "imdb.com, letterboxd.com and boxd.it links are accepted",
    add: "add 💗",
    tabWant: "Want to watch",
    tabSeen: "Watched",
    tabGallery: "Gallery",
    tabActivity: "Our activity",
    coverHint: "tap to open the notebook",
    closeBook: "close notebook",
    slotAdd: "+ photo",
    statWant: "want to watch",
    statSeen: "watched",
    bookEmpty: "first add a movie in “Want to watch” — its page will appear here 💗",
    loosePage: "no movie",
    pageFull: "this page already has 4 photos",
    galHint: "from Pinterest: save the image to your device and add it here. Pinterest links won't work.",
    galCaption: "caption...",
    galTooBig: "couldn't save the photo, browser storage is full. Delete something or upload smaller photos.",
    actEmpty: "it's quiet here... start adding movies and photos 💞",
    undo: "↩ move back",
    done: "✓ watched",
    del: "✕",
    confirmDel: "delete “{t}” together with its page?",
    confirmPhoto: "delete this photo?",
    addedOn: "added",
    watchedOn: "watched",
    errTitle: "please enter a movie title",
    errYear: "year should be 4 digits, e.g. 2001",
    errLink: "the link must go to imdb.com or letterboxd.com",
    forHer: "for her 💗",
    forHim: "for him 💙",
    actAdded: "added “{t}”",
    actWatched: "watched “{t}”",
    actUnwatched: "moved “{t}” back to the list",
    actRated: "rated “{t}” {n} hearts",
    actDeleted: "deleted “{t}”",
    actPhoto: "added a photo to the page “{t}”",
    actPhotoDel: "removed a photo from the notebook",
    locale: "en-US"
  }
};

let state = {
  items: [], photos: [], activity: [],
  tab: 'activity', who: 'me', lang: 'ru', forWhom: 'her',
  bookOpen: false, spread: 0, busy: false, pendingFilm: null
};

function t(k, vars) {
  let s = (T[state.lang] && T[state.lang][k]) || T.ru[k] || k;
  if (vars) Object.keys(vars).forEach(v => s = s.replace('{' + v + '}', vars[v]));
  return s;
}

function pixelURI(grid, px, colorMap) {
  const h = grid.length, w = grid[0].length;
  let rects = '';
  grid.forEach((row, y) => [...row].forEach((c, x) => {
    if (colorMap[c]) rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${colorMap[c]}"/>`;
  }));
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w * px}" height="${h * px}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges">${rects}</svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

function heartSVG(color, px) {
  let rects = '';
  HEART.forEach((row, y) => [...row].forEach((c, x) => {
    if (c === '#') rects += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }));
  return `<svg viewBox="0 0 7 6" width="${7 * px}" height="${6 * px}" shape-rendering="crispEdges" fill="${color}">${rects}</svg>`;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      state.items = d.items || [];
      state.photos = d.photos || [];
      state.activity = d.activity || [];
    }
    const l = localStorage.getItem(KEY + '-lang');
    if (l === 'en' || l === 'ru') state.lang = l;
    const f = localStorage.getItem(KEY + '-for');
    if (f === 'him' || f === 'her') state.forWhom = f;
  } catch (e) {}
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ items: state.items, photos: state.photos, activity: state.activity }));
    return true;
  } catch (e) { return false; }
}

function log(key, vars) {
  state.activity.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), key, vars: vars || {}, ts: Date.now() });
  if (state.activity.length > 300) state.activity.length = 300;
}

function validUrl(raw) {
  try {
    const u = new URL(raw);
    if (u.protocol !== 'https:' && u.protocol !== 'http:') return false;
    const h = u.hostname.replace(/^www\./, '').replace(/^m\./, '');
    return h === 'imdb.com' || h === 'letterboxd.com' || h === 'boxd.it';
  } catch (e) { return false; }
}
function linkLabel(url) { return url.includes('imdb') ? 'IMDb' : 'Letterboxd'; }
function fmtDate(ts) {
  return new Date(ts).toLocaleDateString(t('locale'), { day: 'numeric', month: 'long', year: 'numeric' });
}
function fmtDateTime(ts) {
  return new Date(ts).toLocaleString(t('locale'), { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function applyLang() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  const ti = document.getElementById('title');
  if (ti) ti.placeholder = state.lang === 'en' ? 'e.g. Amélie' : 'например, Амели';
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === state.lang));
  document.getElementById('miniIcon').innerHTML = heartSVG('#ff5c98', 4);
  document.getElementById('coverIcon').innerHTML = heartSVG('#f5dcc0', 8);
  document.getElementById('forBtn').innerHTML = heartSVG('#ff5c98', 2);
  document.querySelectorAll('#forPop button').forEach(b => b.classList.toggle('on', b.dataset.for === state.forWhom));
}

function render() {
  const want = state.items.filter(i => i.status === 'want');
  const seen = state.items.filter(i => i.status === 'watched');
  document.getElementById('cWant').textContent = want.length;
  document.getElementById('cSeen').textContent = seen.length;
  document.getElementById('cGal').textContent = state.items.length;
  document.querySelectorAll('#miniPop [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));

  const show = id => document.getElementById(id).style.display = '';
  const hide = id => document.getElementById(id).style.display = 'none';
  ['activityPanel', 'wantPanel', 'seenPanel', 'galleryPanel'].forEach(hide);
  if (state.tab === 'activity') { show('activityPanel'); renderActivity(); }
  if (state.tab === 'want') { show('wantPanel'); renderCards('wantList', want); }
  if (state.tab === 'seen') { show('seenPanel'); renderCards('seenList', seen); }
  if (state.tab === 'gallery') { show('galleryPanel'); renderBook(); }
}

function renderCards(containerId, list) {
  const el = document.getElementById(containerId);
  el.innerHTML = [...list].sort((a, b) => b.addedAt - a.addedAt).map(it => {
    const isSeen = it.status === 'watched';
    const stars = isSeen
      ? `<div class="rate">${[1,2,3,4,5].map(n =>
          `<button class="hbtn" data-r="${n}" aria-label="${n}">${heartSVG(n <= (it.rating || 0) ? '#ff5c98' : '#ffd6e7', 3)}</button>`
        ).join('')}</div>`
      : '';
    const by = it.by === 'her' ? t('her') : t('me');
    return `
    <article class="card" data-id="${esc(it.id)}">
      <div class="ct">
        <h3>${esc(it.title)}</h3>
        <span class="yr">${it.year ? esc(it.year) : ''}</span>
      </div>
      <div class="meta">
        <span class="tag ${it.by === 'her' ? 'her' : 'me'}">${esc(by)}</span>
        ${isSeen && it.watchedAt ? `<span>${t('watchedOn')} ${fmtDate(it.watchedAt)}</span>` : `<span>${t('addedOn')} ${fmtDate(it.addedAt)}</span>`}
      </div>
      ${stars}
      <div class="acts">
        <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">${linkLabel(it.url)} ↗</a>
        ${isSeen
          ? `<button data-act="undo">${t('undo')}</button>`
          : `<button class="done" data-act="done">${t('done')}</button>`}
        <button class="del" data-act="del">${t('del')}</button>
      </div>
    </article>`;
  }).join('');
}

function renderActivity() {
  const el = document.getElementById('actList');
  if (!state.activity.length) {
    el.innerHTML = `<div class="empty">${t('actEmpty')}</div>`;
    return;
  }
  const icon = {
    actAdded: heartSVG('#ff5c98', 3),
    actWatched: heartSVG('#b48cff', 3),
    actUnwatched: heartSVG('#ffb8d1', 3),
    actRated: heartSVG('#ff9dc2', 3),
    actDeleted: heartSVG('#a0667f', 3),
    actPhoto: heartSVG('#ff5c98', 3),
    actPhotoDel: heartSVG('#a0667f', 3)
  };
  el.innerHTML = state.activity.map(a => {
    const text = t(a.key, a.vars);
    return `<div class="act-item"><span class="ai">${icon[a.key] || icon.actAdded}</span><div><b>${esc(text)}</b><small>${fmtDateTime(a.ts)}</small></div></div>`;
  }).join('');
}

/* ---------- Блокнот: одна страница на один фильм ---------- */

// Страницы: по одной на каждый фильм (по порядку добавления),
// фото с удалённых/старых записей — отдельной страницей в конце,
// затем пустые страницы, чтобы число страниц было чётным
function getPages() {
  const films = [...state.items].sort((a, b) => a.addedAt - b.addedAt);
  const ids = new Set(films.map(f => f.id));
  const pages = films.map(f => ({
    type: 'film',
    film: f,
    photos: state.photos.filter(p => p.filmId === f.id).sort((a, b) => a.addedAt - b.addedAt).slice(0, MAX_PER_PAGE)
  }));
  const loose = state.photos
    .filter(p => !p.filmId || !ids.has(p.filmId))
    .sort((a, b) => a.addedAt - b.addedAt);
  for (let i = 0; i < loose.length; i += MAX_PER_PAGE) {
    pages.push({ type: 'loose', photos: loose.slice(i, i + MAX_PER_PAGE) });
  }
  if (!pages.length) pages.push({ type: 'blank' });
  if (pages.length % 2) pages.push({ type: 'blank' });
  return pages;
}

function pageHTML(page, idx) {
  let head = '';
  let slots = '';
  if (page.type === 'blank') {
    return `<div class="pcontent"><div class="empty-page">${t('bookEmpty')}</div></div><span class="page-no">${idx + 1}</span>`;
  }
  if (page.type === 'film') {
    const f = page.film;
    const by = f.by === 'her' ? t('her') : t('me');
    const st = f.status === 'watched' ? t('statSeen') : t('statWant');
    head = `<div class="film-head">
      <h4>${esc(f.title)}${f.year ? ' · ' + esc(f.year) : ''}</h4>
      <small>${esc(by)} · <span class="st">${st}</span></small>
    </div>`;
  } else {
    head = `<div class="film-head"><h4>${t('loosePage')}</h4></div>`;
  }
  let addUsed = false;
  for (let j = 0; j < MAX_PER_PAGE; j++) {
    const p = page.photos[j];
    if (p) {
      slots += `<div class="slot filled">
        <img src="${p.src}" alt="${esc(p.caption || '')}" data-act="zoom">
        <button class="x" data-act="pdel" data-id="${esc(p.id)}" aria-label="delete">✕</button>
        <input class="cap" type="text" value="${esc(p.caption || '')}" placeholder="${t('galCaption')}" data-act="caption" data-id="${esc(p.id)}" maxlength="120">
      </div>`;
    } else if (page.type === 'film' && !addUsed) {
      addUsed = true;
      slots += `<button class="slot add" data-act="addslot" data-film="${esc(page.film.id)}" type="button">+<small>${t('slotAdd')}</small></button>`;
    } else {
      slots += `<div class="slot ghost"></div>`;
    }
  }
  return `<div class="pcontent">${head}<div class="slots">${slots}</div></div><span class="page-no">${idx + 1}</span>`;
}

function renderBook() {
  const pages = getPages();
  const spreads = pages.length / 2;
  state.spread = Math.max(0, Math.min(state.spread, spreads - 1));
  document.getElementById('cover').classList.toggle('open', state.bookOpen);
  document.getElementById('bookNav').style.display = state.bookOpen ? '' : 'none';
  const l = state.spread * 2, r = l + 1;
  document.getElementById('pageL').innerHTML = pageHTML(pages[l], l);
  document.getElementById('pageR').innerHTML = pageHTML(pages[r], r);
  document.getElementById('pgNo').textContent = `${l + 1}–${r + 1} / ${pages.length}`;
  document.getElementById('prevBtn').disabled = state.spread === 0 || state.busy;
  document.getElementById('nextBtn').disabled = state.spread >= spreads - 1 || state.busy;
}

// Листание: страница-лист переворачивается на 3D
function turn(dir) {
  if (state.busy) return;
  const pages = getPages();
  const spreads = pages.length / 2;
  const target = state.spread + dir;
  if (target < 0 || target >= spreads) return;
  state.busy = true;
  const leaf = document.getElementById(dir > 0 ? 'leafNext' : 'leafPrev');
  const face = leaf.querySelector('.front');
  const back = leaf.querySelector('.back');
  if (dir > 0) {
    face.innerHTML = pageHTML(pages[state.spread * 2 + 1], state.spread * 2 + 1);
    back.innerHTML = pageHTML(pages[target * 2], target * 2);
  } else {
    face.innerHTML = pageHTML(pages[state.spread * 2], state.spread * 2);
    back.innerHTML = pageHTML(pages[target * 2 + 1], target * 2 + 1);
  }
  leaf.classList.add('show');
  void leaf.offsetWidth;
  leaf.classList.add('turn');
  document.getElementById('prevBtn').disabled = true;
  document.getElementById('nextBtn').disabled = true;
  setTimeout(() => {
    state.spread = target;
    leaf.classList.remove('turn', 'show');
    state.busy = false;
    renderBook();
  }, 920);
}

function openBook() {
  if (state.bookOpen) return;
  state.bookOpen = true;
  renderBook();
}
function closeBook() {
  state.bookOpen = false;
  renderBook();
}

document.getElementById('cover').addEventListener('click', openBook);
document.getElementById('prevBtn').addEventListener('click', () => turn(-1));
document.getElementById('nextBtn').addEventListener('click', () => turn(1));
document.getElementById('closeBtn').addEventListener('click', closeBook);
document.addEventListener('keydown', e => {
  if (state.tab !== 'gallery' || !state.bookOpen) return;
  if (e.key === 'ArrowLeft') turn(-1);
  if (e.key === 'ArrowRight') turn(1);
});

document.getElementById('book').addEventListener('click', e => {
  const addBtn = e.target.closest('[data-act="addslot"]');
  if (addBtn) {
    state.pendingFilm = addBtn.dataset.film;
    document.getElementById('fileInput').click();
    return;
  }

  const pdel = e.target.closest('[data-act="pdel"]');
  if (pdel) {
    if (!confirm(t('confirmPhoto'))) return;
    const id = pdel.dataset.id;
    state.photos = state.photos.filter(p => p.id !== id);
    log('actPhotoDel');
    save(); render();
    return;
  }

  const zoom = e.target.closest('[data-act="zoom"]');
  if (zoom) {
    document.getElementById('lbImg').src = zoom.src;
    document.getElementById('lb').classList.add('open');
  }
});
document.getElementById('book').addEventListener('change', e => {
  if (e.target.dataset.act !== 'caption') return;
  const p = state.photos.find(x => x.id === e.target.dataset.id);
  if (p) { p.caption = e.target.value; save(); }
});
document.getElementById('lb').addEventListener('click', () => {
  document.getElementById('lb').classList.remove('open');
});

// Сжатие фото: до 1000px, JPEG — чтобы влезало в хранилище браузера
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const max = 1000;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById('fileInput').addEventListener('change', async e => {
  const filmId = state.pendingFilm;
  const film = state.items.find(i => i.id === filmId);
  const files = [...e.target.files].filter(f => f.type.startsWith('image/'));
  e.target.value = '';
  if (!film || !files.length) { state.pendingFilm = null; render(); return; }

  let count = state.photos.filter(p => p.filmId === filmId).length;
  let added = 0;
  for (const f of files) {
    if (count >= MAX_PER_PAGE) { alert(t('pageFull')); break; }
    try {
      const src = await compressImage(f);
      state.photos.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        src, caption: '', filmId, addedAt: Date.now() + added
      });
      count++; added++;
      log('actPhoto', { t: film.title });
      if (!save()) { state.photos.pop(); state.activity.shift(); alert(t('galTooBig')); break; }
    } catch (err) {}
  }
  save();

  // Открываем блокнот на странице этого фильма
  const pages = getPages();
  const idx = pages.findIndex(p => p.type === 'film' && p.film.id === filmId);
  if (idx >= 0) state.spread = Math.floor(idx / 2);
  state.bookOpen = true;
  state.pendingFilm = null;
  render();
});

/* ---------- Форма фильмов ---------- */

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  const err = document.getElementById('err');
  const title = document.getElementById('title').value.trim();
  const year = document.getElementById('year').value.trim();
  let link = document.getElementById('link').value.trim();
  if (!title) { err.textContent = t('errTitle'); return; }
  if (year && !/^\d{4}$/.test(year)) { err.textContent = t('errYear'); return; }
  if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
  if (!validUrl(link)) { err.textContent = t('errLink'); return; }
  err.textContent = '';

  state.items.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    title, year, url: link, by: state.who,
    status: 'want', rating: 0, addedAt: Date.now(), watchedAt: null
  });
  log('actAdded', { t: title });
  save();
  e.target.reset();
  render();
});

document.getElementById('who').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  state.who = b.dataset.v;
  document.querySelectorAll('#who button').forEach(x => x.classList.toggle('on', x === b));
});

// Мини-меню справа сверху
const miniBtn = document.getElementById('miniBtn');
const miniPop = document.getElementById('miniPop');
miniBtn.addEventListener('click', e => {
  e.stopPropagation();
  miniPop.classList.toggle('open');
});
miniPop.addEventListener('click', e => {
  const b = e.target.closest('[data-tab]');
  if (!b) return;
  state.tab = b.dataset.tab;
  miniPop.classList.remove('open');
  render();
});
document.addEventListener('click', e => {
  if (!e.target.closest('#mini')) miniPop.classList.remove('open');
  if (!e.target.closest('#forWrap')) document.getElementById('forPop').classList.remove('open');
});

// Кнопка «для кого»
document.getElementById('forBtn').addEventListener('click', e => {
  e.stopPropagation();
  document.getElementById('forPop').classList.toggle('open');
});
document.getElementById('forPop').addEventListener('click', e => {
  const b = e.target.closest('[data-for]');
  if (!b) return;
  state.forWhom = b.dataset.for;
  try { localStorage.setItem(KEY + '-for', state.forWhom); } catch (err) {}
  document.getElementById('forPop').classList.remove('open');
  applyLang();
});

document.querySelector('.lang').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  state.lang = b.dataset.lang;
  try { localStorage.setItem(KEY + '-lang', state.lang); } catch (err) {}
  applyLang();
  render();
});

document.getElementById('wantList').addEventListener('click', cardClick);
document.getElementById('seenList').addEventListener('click', cardClick);

function cardClick(e) {
  const card = e.target.closest('.card');
  if (!card) return;
  const id = card.dataset.id;
  const it = state.items.find(i => i.id === id);
  if (!it) return;

  const star = e.target.closest('.hbtn');
  if (star) {
    const n = +star.dataset.r;
    it.rating = it.rating === n ? 0 : n;
    if (it.rating) log('actRated', { t: it.title, n: it.rating });
    save(); render(); return;
  }
  const act = e.target.closest('[data-act]');
  if (!act) return;
  if (act.dataset.act === 'done') {
    it.status = 'watched'; it.watchedAt = Date.now();
    log('actWatched', { t: it.title });
  } else if (act.dataset.act === 'undo') {
    it.status = 'want'; it.watchedAt = null; it.rating = 0;
    log('actUnwatched', { t: it.title });
  } else if (act.dataset.act === 'del') {
    if (!confirm(t('confirmDel', { t: it.title }))) return;
    state.items = state.items.filter(i => i.id !== id);
    state.photos = state.photos.filter(p => p.filmId !== id);
    log('actDeleted', { t: it.title });
  }
  save(); render();
}

// Курсор: пиксельная стрелка и сердечко над кнопками и ссылками
function setupCursor() {
  const arrow = pixelURI(ARROW, 3, { X: '#4a1f35', F: '#ff5c98' });
  const heart = pixelURI(HEART, 3, { '#': '#ff5c98' });
  const st = document.createElement('style');
  st.textContent = `
    html, body { cursor: url("${arrow}") 0 0, auto; }
    a, button, label, .hbtn, .lang button, .who button, .link, .acts button, .mini-btn, .mini-pop button, .for-btn, .for-pop button, .book-nav button, .cover, .slot, .slot img, .slot .x {
      cursor: url("${heart}") 10 9, pointer !important;
    }
    input { cursor: text !important; }
  `;
  document.head.appendChild(st);
}

// Сердечки разлетаются из точки нажатия
document.addEventListener('pointerdown', e => {
  for (let i = 0; i < 6; i++) {
    const d = document.createElement('div');
    d.className = 'burst';
    d.innerHTML = heartSVG(i % 2 ? '#ff5c98' : '#ffb8d1', 2 + (i % 2));
    const ang = (Math.PI * 2 * i) / 6 + Math.random() * 0.5;
    const dist = 40 + Math.random() * 30;
    d.style.left = e.clientX + 'px';
    d.style.top = e.clientY + 'px';
    d.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    d.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 800);
  }
});

// Фоновые сердечки: часть падает сверху вниз, часть поднимается снизу вверх
function decorate() {
  const bg = document.getElementById('bgHearts');
  const hr = document.getElementById('headerHearts');
  const colors = ['#ffd6e7', '#ff9dc2', '#ffb8d1'];
  bg.innerHTML = '';
  for (let i = 0; i < 20; i++) {
    const d = document.createElement('div');
    d.innerHTML = heartSVG(colors[i % colors.length], 3 + (i % 4));
    const s = d.firstChild;
    const down = i % 2 === 0;
    s.classList.add(down ? 'fall' : 'rise');
    s.style.position = 'absolute';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = down ? '-12%' : '110%';
    s.style.opacity = '.2';
    s.style.animationDuration = (12 + Math.random() * 14) + 's';
    s.style.animationDelay = (-Math.random() * 20) + 's';
    bg.appendChild(s);
  }
  hr.innerHTML = [0, 1, 2].map(i => heartSVG(i === 1 ? '#ff5c98' : '#ff9dc2', 5)).join('');
}

load();
applyLang();
setupCursor();
decorate();
render();
</script>
